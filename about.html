<section class="about-copy shell-reading">
  <p class="lead">留白誌是一個以文字為核心的獨立部落格範本，適合散文、評論、閱讀筆記、城市觀察與長篇專題。</p>
  <h2>這個網站怎麼使用？</h2>
  <p>文章以 Markdown 儲存在 <code>_posts</code> 資料夾。新增一篇文章，就會自動出現在首頁、文章彙整頁，也會依分類出現在文章底部的推薦閱讀。</p>
  <h2>設計原則</h2>
  <p>留白、細線、安靜的暖白底與偏紙本的襯線標題。介面刻意減少裝飾，讓內容本身成為視覺主角。</p>
</section>
