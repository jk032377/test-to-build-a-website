name: Migrate selected MukaiWord posts

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/migrate_mukaiword.py"
      - ".github/workflows/migrate-mukaiword.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: pip install requests beautifulsoup4

      - name: Migrate five selected posts and their images
        run: python scripts/migrate_mukaiword.py

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/images/mukai
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Migrate selected posts from mukaiword.com"
          git push
