<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#f4f0e8">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% if site.google_analytics_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics_id }}');
  </script>
  {% endif %}

  {% if site.google_adsense_id %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js?client={{ site.google_adsense_id }}" crossorigin="anonymous"></script>
  {% endif %}
</head>
<body data-baseurl="{{ site.baseurl | default: '' }}">
  <div class="reading-progress" id="readingProgress"></div>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首頁">
        <span class="brand-zh">留白誌</span><span class="brand-en">MARGIN</span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="開啟選單" aria-expanded="false">選單</button>
      <nav class="nav" id="siteNav" aria-label="主要導覽">
        <a href="{{ '/' | relative_url }}">首頁</a>
        <a href="{{ '/archive/' | relative_url }}">文章</a>
        <a href="{{ '/search/' | relative_url }}">搜尋</a>
        <a href="{{ '/about/' | relative_url }}">關於</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <button class="back-to-top" id="backToTop" type="button" aria-label="回到頁面頂端">
    <span aria-hidden="true">↑</span>
  </button>

  <footer class="site-footer">
    <div class="shell footer-mast">
      <div class="footer-wordmark">MARGIN</div>
      <p>把複雜的生活，留下一點可以呼吸的空白。</p>
    </div>
    <div class="shell footer-grid">
      <div class="footer-brand-wrap">
        <div class="footer-brand">留白誌</div>
        <div class="footer-caption">READ · THINK · LEAVE SOME ROOM</div>
      </div>
      <div class="footer-links">
        <span>EXPLORE</span>
        <a href="{{ '/archive/' | relative_url }}">所有文章</a>
        <a href="{{ '/search/' | relative_url }}">搜尋文章</a>
      </div>
      <div class="footer-links">
        <span>ABOUT</span>
        <a href="{{ '/about/' | relative_url }}">關於本站</a>
        <a href="{{ '/privacy/' | relative_url }}">隱私權政策</a>
      </div>
      <div class="copyright">© {{ 'now' | date: '%Y' }} MARGIN</div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
